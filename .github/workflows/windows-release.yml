name: Windows package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target Remapcon
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -G ZIP
      - name: Check ZIP contents
        shell: pwsh
        run: |
          $archive = [System.IO.Compression.ZipFile]::OpenRead("Remapcon-Windows-x64.zip")
          try {
            $files = $archive.Entries.FullName
            foreach ($required in @(
              "Remapcon-Windows-x64/Remapcon.exe",
              "Remapcon-Windows-x64/LICENSE",
              "Remapcon-Windows-x64/README.ja.md",
              "Remapcon-Windows-x64/README.md",
              "Remapcon-Windows-x64/THIRD_PARTY_NOTICES.md",
              "Remapcon-Windows-x64/LICENSES/WebView2-LICENSE.txt",
              "Remapcon-Windows-x64/LICENSES/WebView2-NOTICE.txt"
            )) {
              if ($files -notcontains $required) { throw "Missing from ZIP: $required" }
            }
          } finally {
            $archive.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Remapcon-Windows-x64
          path: Remapcon-Windows-x64.zip
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create $env:GITHUB_REF_NAME Remapcon-Windows-x64.zip
          --verify-tag --title "Remapcon $env:GITHUB_REF_NAME"
          --notes "First public preview. Extract the ZIP and run Remapcon.exe. Microsoft Edge WebView2 Runtime and Visual C++ Redistributable (x64) may be required."
          --prerelease
