name: PadMux Windows package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check UI JavaScript syntax
        run: node --check src/app/ui/app.js
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target padmux padmux-updater
      - name: Check update tags
        shell: pwsh
        run: |
          $updater = (Resolve-Path "build/Release/padmux-updater.exe").Path
          foreach ($tag in @('v1.3.0', 'v1.3.10')) {
            $result = Start-Process -FilePath $updater -ArgumentList @('--validate-tag', $tag) -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "Updater rejected $tag" }
          }
          $invalid = Start-Process -FilePath $updater -ArgumentList @('--validate-tag', 'v1.3') -Wait -PassThru
          if ($invalid.ExitCode -eq 0) { throw "Updater accepted an incomplete tag" }
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -G ZIP
      - name: Verify ZIP with updater
        shell: pwsh
        run: |
          $archive = (Resolve-Path "padmux-windows-x64.zip").Path
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $updater = (Resolve-Path "build/Release/padmux-updater.exe").Path
          $valid = Start-Process -FilePath $updater -ArgumentList @('--verify-archive', ('"' + $archive + '"'), $digest) -Wait -PassThru
          if ($valid.ExitCode -ne 0) { throw "Updater rejected the release ZIP (exit $($valid.ExitCode))" }
          $invalid = Start-Process -FilePath $updater -ArgumentList @('--verify-archive', ('"' + $archive + '"'), ('0' * 64)) -Wait -PassThru
          if ($invalid.ExitCode -eq 0) { throw "Updater accepted an incorrect SHA-256" }
      - name: Check ZIP contents
        shell: pwsh
        run: |
          $archive = [System.IO.Compression.ZipFile]::OpenRead("padmux-windows-x64.zip")
          try {
            $files = $archive.Entries.FullName
            foreach ($required in @(
              "padmux-windows-x64/padmux.exe",
              "padmux-windows-x64/padmux-updater.exe",
              "padmux-windows-x64/LICENSE",
              "padmux-windows-x64/README.ja.md",
              "padmux-windows-x64/README.md",
              "padmux-windows-x64/THIRD_PARTY_NOTICES.md",
              "padmux-windows-x64/LICENSES/WebView2-LICENSE.txt",
              "padmux-windows-x64/LICENSES/WebView2-NOTICE.txt"
            )) {
              if ($files -notcontains $required) { throw "Missing from ZIP: $required" }
            }
          } finally {
            $archive.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: padmux-windows-x64
          path: padmux-windows-x64.zip
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create $env:GITHUB_REF_NAME padmux-windows-x64.zip
          --verify-tag --title "PadMux $env:GITHUB_REF_NAME"
          --notes "Portable Windows x64 build. Extract the ZIP and run padmux.exe. Microsoft Edge WebView2 Runtime and Visual C++ Redistributable (x64) may be required."
