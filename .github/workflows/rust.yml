name: PadMux Rust workspace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - name: Build unchanged C++ configuration reference
        run: |
          $reference = Join-Path $env:RUNNER_TEMP "config-reference"
          New-Item -ItemType Directory -Force $reference | Out-Null
          python tests/reference_config.py "$reference/reference.cpp"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$visualStudio) { throw "MSVC installation not found" }
          @"
          @call "$visualStudio\VC\Auxiliary\Build\vcvars64.bat"
          @if errorlevel 1 exit /b %errorlevel%
          @cl /nologo /std:c++20 /EHsc /W4 /WX /utf-8 /I"$env:GITHUB_WORKSPACE\src" "$reference\reference.cpp" /Fo"$reference\reference.obj" /Fe"$reference\reference.exe" /link user32.lib shell32.lib ole32.lib windowscodecs.lib bcrypt.lib
          "@ | Set-Content "$reference/build.cmd"
          & "$reference/build.cmd"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "PADMUX_CONFIG_REFERENCE=$reference\reference.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: cargo +stable clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo +stable test --workspace --locked --target x86_64-pc-windows-msvc
      - run: cargo +stable build --workspace --locked --target x86_64-pc-windows-msvc
      - run: cargo +stable build --workspace --release --locked --target x86_64-pc-windows-msvc
      - run: cargo +stable run --locked --target x86_64-pc-windows-msvc -- --help
      - name: Package Rust candidate and verify licenses, CRT and ZIP
        run: ./scripts/package.ps1 -OutputDirectory "${{ runner.temp }}/rust-package"
      - uses: actions/upload-artifact@v4
        with:
          name: padmux-rust-windows-x64
          path: |
            ${{ runner.temp }}/rust-package/padmux-rust-windows-x64.zip
            ${{ runner.temp }}/rust-package/padmux-rust-windows-x64.zip.sha256
          if-no-files-found: error
